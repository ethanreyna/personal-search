name = "personal-search"
main = "worker/src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "personal-search.elthan.net", custom_domain = true }
]

[assets]
directory = "./client/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[triggers]
# Hourly; each run syncs the one account most overdue (every 4 hours per account).
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "personal-search-db"
database_id = "cbd2801c-3796-4637-a6d3-18cd7ce185fb"
migrations_dir = "worker/migrations"
